# Superset 앞의 HTTPS 입구. 인증서는 superset-init 이 make_cert.py 로 만든다 (superset/certs).
# Superset 은 컨테이너 안에서 http 8088 로만 돈다 — 밖에서는 이 8443 으로만 들어온다.
server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # CSV 업로드 등
    client_max_body_size 100m;

    location / {
        proxy_pass http://superset:8088;
        # Superset 이 https 와 원래 주소로 링크를 만들게 알려 준다 (superset_config.py 의 ENABLE_PROXY_FIX)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # 큰 조회는 오래 걸린다 (Superset 의 SQL Lab 동기 실행 제한과 맞춘다)
        proxy_read_timeout 300s;
    }
}

# http 로 들어오면 https 로 돌려보낸다
server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
}
