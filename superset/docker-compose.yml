# Superset 6.1.0 (최종 정식 릴리스) — Superset 하나만 띄운다
# 공식 compose 와 달리 전용 PostgreSQL, Redis, Celery 워커를 두지 않는다.
#   메타데이터 DB : nl2sql-db (루트 docker-compose.yml) 와 같은 서버의 superset 데이터베이스 — 먼저 띄워 둔다
#   캐시         : 프로세스 메모리 (superset_config.py)
#
# 실행: cp .env.example .env  (값 채우기)
#       docker compose up -d --build
#       http://localhost:8088  (관리자: .env 의 ADMIN_USERNAME / ADMIN_PASSWORD)
name: nl2sql-superset

x-superset: &superset
  build: .
  image: nl2sql-superset:6.1.0
  env_file: .env
  extra_hosts:
    # 호스트에 열린 nl2sql-db(5432)에 닿는다
    - "host.docker.internal:host-gateway"

services:
  superset-init:
    <<: *superset
    container_name: nl2sql-superset-init
    command: ["sh", "/app/init.sh"]
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./init.sh:/app/init.sh:ro
    restart: "no"

  superset:
    <<: *superset
    container_name: nl2sql-superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      superset-init:
        condition: service_completed_successfully
