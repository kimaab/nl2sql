# nl2sql 로컬 개발용 컨테이너 전부: 메타데이터 DB(PostgreSQL), Superset, 그 앞의 HTTPS 입구(nginx)
# 백엔드와 화면은 여기 없다 — 백엔드는 PyCharm(uvicorn), 화면은 Vite 로 띄운다.
#   db            : nl2sql 메타데이터 DB (nl2sql) 와 Superset 메타데이터 DB (superset). 테이블은 각자 만든다
#                   — nl2sql 은 백엔드 기동 때 backend/schema.sql, superset 은 superset-init
#   superset      : Redis, Celery 없이 하나만 돈다. 캐시는 프로세스 메모리 (superset_config.py)
#   nginx         : HTTPS 를 받아 Superset 에 http 로 넘긴다. 인증서는 자체 서명 (make_cert.py → certs/)
#
# 실행: cp .env.example .env  (값 채우기)
#       docker compose up -d --build
#       nl2sql 백엔드  backend/.env: DB_URL=postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5432/nl2sql
#       Superset       https://localhost:8443  (관리자: .env 의 ADMIN_USERNAME / ADMIN_PASSWORD)
#       브라우저 경고를 없애려면 certs/ca.crt 를 그 PC 의 신뢰할 수 있는 루트 인증 기관에 등록한다
name: nl2sql

x-superset: &superset
  build: .
  image: nl2sql-superset:6.1.0
  env_file: .env
  environment:
    # Superset 메타데이터는 같은 db 서버의 superset 데이터베이스
    SUPERSET_DB_HOST: db
    SUPERSET_DB_PORT: "5432"
    SUPERSET_DB_USER: ${POSTGRES_USER}
    SUPERSET_DB_PASSWORD: ${POSTGRES_PASSWORD}
    SUPERSET_DB_NAME: superset

services:
  db:
    image: postgres:17
    container_name: nl2sql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nl2sql
      TZ: Asia/Seoul
    ports:
      # 백엔드(PyCharm)가 호스트에서 붙는다
      - "5432:5432"
    volumes:
      - nl2sql-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nl2sql"]
      interval: 5s
      timeout: 3s
      retries: 10

  superset-init:
    <<: *superset
    container_name: nl2sql-superset-init
    command: ["sh", "/app/init.sh"]
    user: root  # certs/ 에 인증서를 쓴다
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./init.sh:/app/init.sh:ro
      - ./make_cert.py:/app/make_cert.py:ro
      - ./certs:/certs
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  superset:
    <<: *superset
    container_name: nl2sql-superset
    restart: unless-stopped
    # 밖으로 열지 않는다 — nginx 만 들어온다
    expose:
      - "8088"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27.5-alpine
    container_name: nl2sql-superset-https
    restart: unless-stopped
    ports:
      - "8443:8443"
      # 예전 주소(http://...:8088)로 오면 https 로 돌려보낸다
      - "8088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset:
        condition: service_started

volumes:
  nl2sql-db-data:
    # 루트 docker-compose.yml 시절부터 쓰던 볼륨을 그대로 쓴다 (데이터 유지)
    name: nl2sql_nl2sql-db-data
